[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "belief-ledger-gateway"
version = "1.0.0rc3"
description = "Evidence-backed policy enforcement for AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["belief-ledger-core==1.0.0rc3", "PyYAML>=6.0,<7"]

[project.scripts]
belief-ledger = "belief_ledger_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/belief_ledger_gateway"]
