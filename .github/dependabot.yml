version: 2
updates:
  # One `uv` entry covers the whole workspace: it owns uv.lock (the frozen resolution every
  # CI job installs from) and it reaches the member manifests too. PR #19 bumped hatchling in
  # the root and all four packages/*/pyproject.toml from this single entry, so per-package
  # `pip` entries add nothing.
  #
  # Do not also declare `pip` for `/`. Two ecosystems claiming the same directory made
  # Dependabot treat the entry that had opened the cryptography security PR as deleted, and
  # it refused to rebase that PR ("the dependabot.yml entry that created this PR has been
  # deleted"). Adding a second entry for a directory orphans the open PRs of the first.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
