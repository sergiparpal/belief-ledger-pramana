name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The default token is already read-only at the repository level; declaring it here as well
# keeps the guarantee visible in the file and survives a change to that repository setting.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA, not a tag: a tag is mutable and can be
# repointed by the upstream owner, a SHA cannot. The trailing comment records which release the
# SHA corresponds to so Dependabot can still propose bumps and a human can still read it.

jobs:
  core-no-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv .core-venv
      - run: uv pip install --python .core-venv/bin/python ./packages/core pytest
      - run: .core-venv/bin/python -m pytest --confcutdir=tests/core tests/core tests/conformance/test_enforcement_profiles.py
      - run: .core-venv/bin/python -c "import belief_ledger_core; assert belief_ledger_core.__version__ == '1.0.0rc2'"
      - run: uvx ruff check packages/core/src tests/core

  hermes-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-packages --group dev
      # Hermes is the host, not a project dependency. Install the audited host
      # only for contract jobs and avoid a subsequent project re-sync.
      - run: uv pip install --python .venv "hermes-agent==0.19.0"
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy packages/core/src packages/reference/src belief_ledger_pramana
      - run: uv run --no-sync python -m pytest -m "not live_llm" --cov=belief_ledger_core --cov=belief_ledger_pramana --cov=belief_ledger_reference --cov-branch --cov-report=xml
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-test-evidence
          path: coverage.xml

  hermes-supported:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        hermes: ["0.19.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv pip install --python .venv "hermes-agent==${{ matrix.hermes }}"
      - run: uv run --no-sync python -c "import importlib.metadata; assert importlib.metadata.version('hermes-agent') == '${{ matrix.hermes }}'"
      - run: uv run --no-sync python -m pytest tests/adapters/hermes tests/integration tests/contract/test_plugin_contract.py

  exact-hermes-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: git clone https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
      - run: git -C /tmp/hermes-agent checkout 3ef6bbd201263d354fd83ec55b3c306ded2eb72a
      - run: uv run python scripts/check_hermes_contract.py --checkout /tmp/hermes-agent

  reference-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run python -m pytest tests/conformance tests/adapters/reference tests/adapters/hermes
      - run: uv run python examples/deployment_gate/run.py --adapter reference --profile strict --format json

  replay-claims-evaluations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run python -m pytest tests/contract/test_v1_replay.py tests/unit/test_product_claims.py tests/unit/test_dependency_boundaries.py
      - run: uv run python scripts/check_product_claims.py
      - run: uv run python scripts/check_dependency_boundaries.py
      - run: uv run python -m evaluations.report --suite all --offline

  all-wheel-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run python scripts/build_workspace.py --packages core hermes reference --output-manifest build/artifacts.json
      - run: uv run python scripts/inspect_artifacts.py --manifest build/artifacts.json
      - run: uv run python scripts/smoke_install.py --matrix core,core+reference,hermes --manifest build/artifacts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc2-wheels
          path: build/workspace-*/*.whl

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --with pip-audit pip-audit

  path-config-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv pip install --python .venv "hermes-agent==0.19.0"
      - run: uv run --no-sync python -m pytest tests/unit/test_config.py tests/unit/test_store.py tests/contract/test_plugin_contract.py tests/contract/test_real_hermes_manager.py

  hermes-main-canary:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-main
      - run: uv run python scripts/check_hermes_contract.py --checkout /tmp/hermes-main --allow-version-drift

  ci-complete:
    # One stable check name for the branch ruleset to require. Matrix legs come and go, so
    # requiring them individually would turn a dropped Python version into a required check
    # that never reports again — and an unsatisfiable required check blocks every merge.
    # This job depends on the ones that must pass and fails unless all of them succeeded.
    # hermes-main-canary is continue-on-error, so it stays out by its author's intent.
    if: always()
    needs: [core-no-hermes, hermes-adapter, hermes-supported, exact-hermes-contract, reference-conformance, replay-claims-evaluations, all-wheel-artifacts, dependency-audit, path-config-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
