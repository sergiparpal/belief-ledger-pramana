name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The default token is already read-only at the repository level; declaring it here as well
# keeps the guarantee visible in the file and survives a change to that repository setting.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA, not a tag: a tag is mutable and can be
# repointed by the upstream owner, a SHA cannot. The trailing comment records which release the
# SHA corresponds to so Dependabot can still propose bumps and a human can still read it.

jobs:
  core-no-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv .core-venv
      - run: uv pip install --python .core-venv/bin/python ./packages/core pytest
      - run: .core-venv/bin/python -m pytest --confcutdir=tests/core tests/core tests/conformance/test_enforcement_profiles.py
      - run: .core-venv/bin/python -c "import belief_ledger_core; assert belief_ledger_core.__version__ == '1.0.0rc4'"
      - run: uvx ruff check packages/core/src tests/core

  gateway-no-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --no-sync python -m pytest tests/gateway
      - run: uv run --no-sync belief-ledger demo --format json
      - run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('hermes_agent') is None"

  hermes-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-packages --group dev
      # Hermes is the host, not a project dependency. Install the audited host
      # only for contract jobs and avoid a subsequent project re-sync.
      - run: uv pip install --python .venv "hermes-agent==0.19.0"
      # Hermes 0.19.0 pins vulnerable Pillow 12.2.0 and cryptography 46.0.7.
      # Keep the tested host release but override those leaves until Hermes
      # relaxes its metadata. cryptography is held at >=50 because
      # PYSEC-2026-3552 affects 49.x; the ceiling exists only to keep the
      # override deliberate, so raise both bounds together when 51 lands.
      - run: uv pip install --python .venv "Pillow>=12.3,<13"
      - run: uv pip install --python .venv "cryptography>=50.0.0,<51"
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy packages/core/src packages/gateway/src packages/reference/src packages/mcp/src belief_ledger_pramana
      - run: uv run --no-sync python -m pytest -m "not live_llm" --cov=belief_ledger_core --cov=belief_ledger_gateway --cov=belief_ledger_mcp --cov=belief_ledger_pramana --cov=belief_ledger_reference --cov-branch --cov-report=xml
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-test-evidence
          path: coverage.xml

  hermes-supported:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        hermes: ["0.19.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv pip install --python .venv "hermes-agent==${{ matrix.hermes }}"
      - run: uv pip install --python .venv "Pillow>=12.3,<13"
      - run: uv pip install --python .venv "cryptography>=50.0.0,<51"
      - run: uv run --no-sync python -c "import importlib.metadata; assert importlib.metadata.version('hermes-agent') == '${{ matrix.hermes }}'"
      - run: uv run --no-sync python -m pytest tests/adapters/hermes tests/integration tests/contract/test_plugin_contract.py

  exact-hermes-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      # An anonymous `git clone` shares the runner pool's IP rate limit and intermittently
      # comes back HTTP 429, which failed this required job on a green commit. Checking the
      # host out through the action instead authenticates the fetch with the workflow token,
      # retries on a throttled response, and transfers only the audited commit rather than
      # the whole history. Credentials are dropped once the fetch is done.
      - name: Check out the audited Hermes commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 3ef6bbd201263d354fd83ec55b3c306ded2eb72a
          path: hermes-agent-audit
          persist-credentials: false
      - run: uv run python scripts/check_hermes_contract.py --checkout hermes-agent-audit

  reference-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run python -m pytest tests/conformance tests/adapters/reference tests/adapters/hermes
      - run: uv run python examples/deployment_gate/run.py --adapter reference --profile strict --format json
      - run: uv run python examples/custom_tool_gate/run.py --format json

  mcp-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run --no-sync python -m pytest tests/mcp tests/conformance
      - run: uv run --no-sync python -c "from belief_ledger_mcp import BeliefLedgerMcp; assert 'record_approval' not in BeliefLedgerMcp.SAFE_TOOL_NAMES"

  replay-claims-evaluations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run python -m pytest tests/contract/test_v1_replay.py tests/unit/test_product_claims.py tests/unit/test_doc_invariants.py tests/unit/test_dependency_boundaries.py
      - run: uv run python scripts/check_product_claims.py
      - run: uv run python scripts/check_doc_invariants.py
      # Snapshots are a cache, so the thing worth gating is that an accelerated rebuild is
      # byte-identical to a full one against the frozen v1 fixtures.
      - run: uv run python -m pytest tests/unit/test_snapshots.py tests/properties/test_ledger_properties.py
      - run: uv run python scripts/check_dependency_boundaries.py
      - run: uv run python scripts/check_workspace_boundaries.py
      - run: uv run python -m evaluations.report --suite all --offline

  all-wheel-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run python scripts/build_workspace.py --packages core gateway hermes mcp reference --output-manifest build/artifacts.json
      - run: uv run python scripts/inspect_artifacts.py --manifest build/artifacts.json
      - run: uv run python -m twine check build/workspace-*/*.whl
      - run: uv run python scripts/smoke_install.py --matrix core,core+gateway,core+reference,core+gateway+mcp,hermes --manifest build/artifacts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc4-wheels
          path: build/workspace-*/*.whl

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv pip install --python .venv "hermes-agent==0.19.0"
      - run: uv pip install --python .venv "Pillow>=12.3,<13"
      - run: uv pip install --python .venv "cryptography>=50.0.0,<51"
      # These Hermes advisories currently flag 0.19.0 although their published
      # affected ranges end at 0.12.0/2026.4.30. Keep explicit, reviewable
      # exceptions while auditing every installed host dependency.
      - run: uv run --no-sync --with pip-audit pip-audit --ignore-vuln CVE-2026-10221 --ignore-vuln CVE-2026-10224

  path-config-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv pip install --python .venv "hermes-agent==0.19.0"
      - run: uv pip install --python .venv "Pillow>=12.3,<13"
      - run: uv pip install --python .venv "cryptography>=50.0.0,<51"
      - run: uv run --no-sync python -m pytest tests/unit/test_config.py tests/unit/test_store.py tests/contract/test_plugin_contract.py tests/contract/test_real_hermes_manager.py
      - run: uv run --no-sync belief-ledger demo --format json

  hermes-main-canary:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-packages --group dev
      # Same throttling exposure as exact-hermes-contract. This job is continue-on-error, so a
      # 429 here costs signal rather than a red build, but a canary that flakes is not a canary.
      - name: Check out the Hermes default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent-main
          persist-credentials: false
      - run: uv run python scripts/check_hermes_contract.py --checkout hermes-agent-main --allow-version-drift

  ci-complete:
    # One stable check name for the branch ruleset to require. Matrix legs come and go, so
    # requiring them individually would turn a dropped Python version into a required check
    # that never reports again — and an unsatisfiable required check blocks every merge.
    # This job depends on the ones that must pass and fails unless all of them succeeded.
    # hermes-main-canary is continue-on-error, so it stays out by its author's intent.
    if: always()
    needs: [core-no-adapters, gateway-no-hermes, hermes-adapter, hermes-supported, exact-hermes-contract, reference-conformance, mcp-conformance, replay-claims-evaluations, all-wheel-artifacts, dependency-audit, path-config-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
